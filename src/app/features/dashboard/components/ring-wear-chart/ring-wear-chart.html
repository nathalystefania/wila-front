<section class="rounded-lg border border-outline/20 bg-surface-container p-5">
  <header class="mb-5">
    <h2 class="text-2xl font-semibold text-on-surface">Desgaste promedio por anillo</h2>

    <p class="mt-1 text-base text-on-surface-variant">
      Comparación del porcentaje promedio de desgaste de los carbones de cada anillo.
    </p>
  </header>

  @if (hasData()) {
    <div class="chart-container">
      <canvas #chartCanvas aria-label="Gráfico de desgaste promedio por anillo"></canvas>
    </div>
  } @else {
    <div class="flex items-center justify-center min-h-72 text-base text-on-surface-variant">
      No hay datos de desgaste disponibles.
    </div>
  }
</section>
