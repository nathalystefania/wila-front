<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wila - Premium Dark Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Meta Color Scheme -->
    <meta name="color-scheme" content="dark" />

    <!-- Google Fonts and Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Material+Icons&display=swap" rel="stylesheet">

    <!-- Prevent FOUC: Load user theme preference -->
    <script>
      (function() {
        const theme = localStorage.getItem('color-scheme') || 'dark';
        document.querySelector('meta[name="color-scheme"]').content = theme;
        document.documentElement.classList.remove('dark-medium-contrast', 'light-medium-contrast');
        if (theme === 'light') {
          document.documentElement.classList.add('light-medium-contrast');
        } else {
          document.documentElement.classList.add('dark-medium-contrast');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
