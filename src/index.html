<!doctype html>
<html lang="es" class="dark-high-contrast">
  <head>
    <meta charset="utf-8" />
    <title>Wila - Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Meta Color Scheme -->
    <meta name="color-scheme" content="dark" />

    <!-- Google Fonts and Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Prevent FOUC: Load user theme preference -->
    <script>
      (function() {
        const theme = localStorage.getItem('color-scheme') || 'dark';
        document.querySelector('meta[name="color-scheme"]').content = theme;
        if (theme === 'light') {
          document.documentElement.classList.add('light-theme');
          document.documentElement.classList.remove('dark-high-contrast');
        } else {
          document.documentElement.classList.remove('light-theme');
          document.documentElement.classList.add('dark-high-contrast');
        }
      })();
    </script>
  </head>
  <body class="dark">
    <app-root></app-root>
  </body>
</html>
